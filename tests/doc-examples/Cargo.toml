[package]
name = "doc-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Makes the Markdown docs RUNNABLE. The integration test in tests/doc_examples.rs
# scans README.md + docs/**/*.md for fenced `console`/`bash`/`sh` blocks that
# show codefang/uast invocations, rewrites placeholder paths to the hercules
# fixture, runs each against the freshly built Rust binary, and asserts rc 0.
#
# The test discovers the binaries in target/{release,debug} and builds them
# with cargo when they are absent (a bin-only package cannot be a dependency).
[dependencies]

# No library or binary target: this crate exists only to host the integration
# test under tests/. An empty lib keeps cargo happy without shipping code.
[lib]
path = "src/lib.rs"

[dev-dependencies]
# An empty HOME for every documented command (no ~/.codefang.yaml leaks in).
tempfile = { workspace = true }
