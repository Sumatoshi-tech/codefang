# codefang configuration file
# Place this file in the directory you run codefang from, or in $HOME, or
# pass it with --config <file>. Every key sets the DEFAULT of one
# `codefang run` flag; values shown below are the compiled defaults.
# Uncomment and modify as needed (site/guide/configuration.md).
#
# Precedence: explicit flag > CODEFANG_* environment > this file > default.
#   CODEFANG_HISTORY_BURNDOWN_GRANULARITY=15
#   CODEFANG_ANALYZERS=history/devs,history/burndown
#
# Keys not listed here are not read: a file setting one loads with a single
# "warning: ignoring unsupported config keys: ..." line.

# Analyzer ids or globs run when -a is absent. Empty means all analyzers.
# analyzers: []

# pipeline:
#   max_changes_per_commit: 0   # --max-changes-per-commit (0 = 10000)

# history:
#   tick_size: 24               # --tick-size, hours per tick
#   burndown:
#     granularity: 30           # --granularity, ticks per age band
#     sampling: 30              # --sampling, ticks per sample
#     track_files: false        # --burndown-files
#     track_people: false       # --burndown-people
#   devs:
#     consider_empty_commits: false   # --empty-commits
#     anonymize: false                # --anonymize
#   sentiment:
#     min_comment_length: 20    # --min-comment-len (0 disables the filter)
#   shotness:
#     dsl_struct: 'rfilter(.roles has "Function")'   # --shotness-dsl-struct
#     dsl_name: ".props.name"                         # --shotness-dsl-name
#   typos:
#     max_distance: 4           # --typos-max-distance
#   anomaly:
#     threshold: 2.0            # --anomaly-threshold
#     window_size: 20           # --anomaly-window
