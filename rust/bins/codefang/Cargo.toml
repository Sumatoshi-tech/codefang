[package]
name = "codefang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "codefang"
path = "src/main.rs"

[features]
default = []
# The `mcp` command (cmd/codefang/commands/mcp.go) carries `//go:build ignore`
# in Go and is NOT wired into the root command. Mirror that: feature-gated, off
# by default. See DESIGN.md §4.1.
mcp = []
# `--profile` pprof HTTP server (localhost:6060). The memory watchdog is always
# available; this feature is reserved for the pprof HTTP endpoints (behavioral
# parity only, never machine output bytes).
profile = []

[dependencies]
clap = { workspace = true }
# KEEP libgit2 (vendored via git2). The entrypoint links a core libgit2 path so
# the binary anchors the vendored build; per-thread Repository usage lands with
# cf-gitlib. See DESIGN §3.
git2 = { workspace = true }
# Build/version metadata — `codefang version` reproduces the Go output via the
# ldflags-equivalent constants populated by cf-version's build.rs. See DESIGN §4.1.
cf-version = { path = "../../crates/cf-version" }
# Report serialization MUST route through cf-gojson (Go encoding/json byte-parity:
# HTML-escape, byte-sorted map keys, declaration-order structs, shortest-float).
# NEVER serde_json for machine output.
cf-gojson = { path = "../../crates/cf-gojson" }
# YAML report serialization MUST route through cf-goyaml (gopkg.in/yaml.v3
# byte-parity: 2-space block indent, nil-slice -> `[]`, struct-declaration key
# order, yaml.v3 scalar quoting). NEVER serde_yaml for machine output.
cf-goyaml = { path = "../../crates/cf-goyaml" }
# history/imports analyzer report computation + Go-value lowering.
cf-imports = { path = "../../crates/cf-imports" }
# history/devs analyzer: ComputedMetrics + Go-value lowering for the
# `run --analyzers history/devs --head` capture.
cf-devs = { path = "../../crates/cf-devs" }
# history/typos analyzer: metrics_report_value for the empty-report
# `run --analyzers history/typos --format json` capture (repo-independent
# constant, like history/imports). Routes the bytes through cf-gojson parity.
cf-typos = { path = "../../crates/cf-typos" }
# libgit2-backed repository / commit access for the head-only run path.
cf-gitlib = { path = "../../crates/cf-gitlib" }
# Loose people-dict construction (ReversedPeopleDict) for identity parity.
cf-analyzers-plumbing = { path = "../../crates/cf-analyzers-plumbing" }
# Go-`time.RFC3339`-parity unix→string formatter for tick bounds.
cf-analyze = { path = "../../crates/cf-analyze" }
# history/anomaly analyzer: ComputedMetrics + Go-value lowering for the
# `run --analyzers history/anomaly --head` capture (HEAD merge closed form).
cf-anomaly = { path = "../../crates/cf-anomaly" }
# Vendor / generated path-policy exclusion (TreeDiff.filterChanges parity).
cf-pathpolicy = { path = "../../crates/cf-pathpolicy", features = ["default-deps"] }
# static/composition analyzer: raw-file classifier + aggregator for the
# `run --analyzers static/composition --head` static-analysis captures.
cf-composition = { path = "../../crates/cf-composition" }
# history/burndown analyzer: ComputedMetrics + Go-value lowering for the
# `run --analyzers history/burndown --head` captures (HEAD closed form).
cf-analyzer-burndown = { path = "../../crates/cf-analyzer-burndown" }
# CFB1 binary envelope (--format bin) for the burndown machine output.
cf-reportutil = { path = "../../crates/cf-reportutil" }
# UAST parser facade: parse each source file in the static/imports folder phase
# into a node tree the imports analyzer reads (extractImportsFromUAST parity).
cf-uast = { path = "../../crates/cf-uast" }
# Canonical UAST node model produced by cf-uast::Parser::parse.
cf-uast-node = { path = "../../crates/cf-uast-node" }
# static/complexity analyzer: per-function complexity over each file's UAST.
cf-complexity = { path = "../../crates/cf-complexity" }
# static/comments analyzer: per-file comment/function analysis driving the
# `run --analyzers static/comments --format yaml` static capture.
cf-comments = { path = "../../crates/cf-comments" }
# history/quality analyzer: TickQuality + ComputeAllMetrics + JSON serializer for
# the streaming `run --analyzers history/quality --format json --limit N` capture.
cf-quality = { path = "../../crates/cf-quality" }
