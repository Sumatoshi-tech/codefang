[package]
name = "cf-analyzers-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# NOTE TO INTEGRATOR: this crate is part of the rust/ workspace (crates/* glob).
# It depends on the tier-0 byte-compatible JSON encoder cf-gojson so that the
# reporter's machine JSON path is byte-identical to Go's encoding/json (DESIGN
# Rule 1); it never uses serde_json for report output. The local report.rs /
# node.rs / identity_mixin.rs / hibernation.rs / checkpoint stand-ins should be
# replaced by re-exports of cf-analyze / cf-uast-node / cf-plumbing /
# cf-streaming / cf-persist as those crates land (DESIGN Rule 5).
[dependencies]
cf-gojson = { path = "../cf-gojson" }
