<div class="overflow-x-auto">
    <table class="w-full text-sm">
        <thead>
            <tr class="border-b border-stone-200 dark:border-stone-700">
{% for header in headers %}
                <th class="px-4 py-3 text-left font-medium text-stone-500 dark:text-stone-400">{{ header }}</th>
{% endfor %}
            </tr>
        </thead>
        <tbody>
{% for row in rows %}
            <tr class="border-b border-stone-100 dark:border-stone-800 {% if striped and loop.index0 is odd %}bg-stone-50 dark:bg-stone-800/50{% endif %}">
{% for cell in row %}
                <td class="px-4 py-3 text-stone-700 dark:text-stone-300">{{ cell|safe }}</td>
{% endfor %}
            </tr>
{% endfor %}
        </tbody>
    </table>
</div>
