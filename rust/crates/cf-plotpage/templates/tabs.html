<div class="tabs" data-tabs="{{ id }}">
    <div class="flex border-b border-stone-200 dark:border-stone-700" role="tablist">
{% for item in items %}
        <button
            type="button"
            role="tab"
            aria-selected="{% if loop.index0 == 0 %}true{% else %}false{% endif %}"
            aria-controls="{{ id }}-{{ item.id }}"
            data-tab="{{ item.id }}"
            class="px-4 py-2 text-sm font-medium border-b-2 {% if loop.index0 == 0 %}border-accent text-accent{% else %}border-transparent text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-300{% endif %} transition-colors focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 dark:focus:ring-offset-stone-900"
            onclick="switchTab('{{ id }}', '{{ item.id }}')"
        >{{ item.label }}</button>
{% endfor %}
    </div>
{% for item in items %}
    <div
        id="{{ id }}-{{ item.id }}"
        role="tabpanel"
        class="tab-panel p-4 {% if loop.index0 != 0 %}hidden{% endif %}"
        data-panel="{{ item.id }}"
    >{{ item.content|safe }}</div>
{% endfor %}
</div>
