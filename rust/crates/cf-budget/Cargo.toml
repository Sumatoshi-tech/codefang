[package]
name = "cf-budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Byte-size multipliers (Go pkg/units parity): KiB/MiB/GiB constants used by
# the cost-model constants and both solvers.
cf-units = { path = "../cf-units" }
# CoordinatorConfig is the solver's output type (Go internal/framework). The
# solver is the BudgetSolver callback that cf-framework's
# build_config_from_params accepts (Go run.go:1410
# framework.BuildConfigFromParams(params, budget.SolveForBudget)).
cf-framework = { path = "../cf-framework" }
