[package]
name = "cf-budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# KiB/MiB/GiB byte-size multipliers used by the cost-model constants and both
# solvers.
cf-units = { path = "../cf-units" }
# CoordinatorConfig is the solver's output type; solve_for_budget is the
# budget-solver callback that cf-framework's build_config_from_params accepts.
cf-framework = { path = "../cf-framework" }
thiserror = "1"
