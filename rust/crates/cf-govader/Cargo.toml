# cf-govader — Rust port of github.com/jonreiter/govader @ f6505c8d03cc, the VADER
# (Valence Aware Dictionary and sEntiment Reasoner) sentiment algorithm.
#
# DESIGN.md §2.6 / rule 7: VADER scores are floats that reach machine reports, so
# the lexicon + scoring algorithm are reproduced EXACTLY and the lexicon/emoji
# tables are vendored BYTE-FOR-BYTE (data/vaderLexicon.txt,
# data/emojiUTF8Lexicon.txt — copied verbatim from the govader module's
# rawdata/). No external crates: the algorithm uses only std + include_str!.

