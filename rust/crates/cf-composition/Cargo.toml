[package]
name = "cf-composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Byte-identity report serialization. NEVER serde_json for output. See DESIGN §2.
cf-gojson = { workspace = true }
# Byte-identical YAML (gopkg.in/yaml.v3 parity). NEVER serde_yaml for output.
cf-goyaml = { workspace = true }
# enry v2.1.0 language data (LanguagesByExtension) — drives enry.IsConfiguration
# byte-for-byte instead of a hand-rolled extension list.
cf-langpath = { path = "../cf-langpath" }

[dev-dependencies]
serde_json = { workspace = true }
