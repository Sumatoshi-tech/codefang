# cf-alg-bloom — Rust port of Go package pkg/alg/bloom.
#
# A space-efficient probabilistic set-membership filter (Bloom filter) using the
# Kirsch–Mitzenmacher (2006) double-hashing technique over an FNV-128a kernel.
#
# This crate is INTERNAL behavior only: per DESIGN.md the bloom filter is used by
# alg/lru, analyze, cohesion and couples as a membership pre-filter and never
# appears in any MACHINE-format report. It therefore does NOT depend on the
# cf-gojson / cf-goyaml byte-compat serialization crates. Its MarshalBinary /
# UnmarshalBinary on-the-wire layout is reproduced byte-for-byte from the Go
# implementation (big-endian header + words) for any cross-boundary persisted
# state, but is not user-visible serialization.
#
# Pure std; zero external crates.
[package]
name = "cf-alg-bloom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

