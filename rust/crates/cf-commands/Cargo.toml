[package]
name = "cf-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Analyzer-registration + clap command construction for codefang (Go cmd/codefang/commands port): the run/render/version command tree and dynamic per-analyzer flags."

# cf-commands is the tier-8 analyzer-registration + clap command-construction
# aggregation point (DESIGN §1 tier 8, §4). It mirrors Go's
# cmd/codefang/commands package: builds the run/render/version clap commands,
# registers every analyzer and its dynamic per-analyzer flags, and routes all
# report serialization through the shared go-compat crates (never raw serde).
#
# Dependency reality: the runtime execution path (the run/render handlers) needs
# sibling crates that are still scaffolds in this tree (cf-gitlib and the 16
# analyzer crates) plus cf-analyze (which currently does not compile). Those are
# declared optional behind the `runtime` feature so the self-contained parts of
# this crate -- the format-validation logic, the version command, and the full
# clap command tree with every literal and dynamic flag -- build and test
# against the already-compiling cf-version and cf-pipeline crates. See the
# crate-level rustdoc and the workflow notes for the remaining wiring.

[features]
# Default builds only the parts that do NOT depend on unported sibling crates:
# the clap command tree, format validation, and the version command.
default = []

# `runtime` pulls in the remaining execution crates (framework runner,
# checkpoint/cache, observability, plot/store) for the not-yet-wired streaming
# pipeline paths. The core run pipeline + registry (this crate's `pipeline` and
# `handlers` modules) now depend on the analyzer + git crates unconditionally,
# so they are no longer behind this feature.
runtime = [
    "dep:cf-framework",
    "dep:cf-config",
    "dep:cf-checkpoint",
    "dep:cf-budget",
    "dep:cf-observability",
    "dep:cf-plotpage",
    "dep:cf-storage",
]

# The Go `mcp` command is //go:build ignore and NOT shipped by default
# (DESIGN §4.1). Mirror it as a non-default feature.
mcp = ["dep:cf-mcp"]

[dependencies]
clap = { workspace = true }
# Generates the shell-completion scripts for the `completion` subcommand, the
# Rust analogue of the bytes cobra emits for its auto-registered completion
# command (bash/fish/powershell/zsh).
clap_complete = "4"

# Real, compiling sibling crates depended on unconditionally.
cf-version = { path = "../cf-version" }
cf-pipeline = { path = "../cf-pipeline" }

# --- Run-pipeline execution crates (the general run pipeline + registry) ---
# Report serialization MUST route through these go-compat crates, never serde.
cf-gojson = { path = "../cf-gojson" }
cf-goyaml = { path = "../cf-goyaml" }
cf-reportutil = { path = "../cf-reportutil" }
# UAST parse for the shared static folder phase (parse the file set once).
cf-uast = { path = "../cf-uast" }
cf-uast-node = { path = "../cf-uast-node" }
# Vendor/generated path-policy exclusion shared by the static + history phases.
cf-pathpolicy = { path = "../cf-pathpolicy", features = ["default-deps"] }
# libgit2-backed repository/commit access for the single history revwalk.
cf-gitlib = { path = "../cf-gitlib" }
# Go-time.RFC3339 formatting + metadata for history tick bounds / timeseries.
cf-analyze = { path = "../cf-analyze" }
cf-textutil = { path = "../cf-textutil" }
cf-langpath = { path = "../cf-langpath" }
# Line-mode diff (diffmatchpatch parity) for history per-file line stats.
cf-godiff = { path = "../cf-godiff" }
cf-alg-bloom = { path = "../cf-alg-bloom" }
cf-alg-levenshtein = { path = "../cf-alg-levenshtein" }
cf-analyzers-plumbing = { path = "../cf-analyzers-plumbing" }
cf-burndown-core = { path = "../cf-burndown-core" }
# --- Analyzer math crates (per-file Analyze + report serializers) ---
cf-complexity = { path = "../cf-complexity" }
cf-clones = { path = "../cf-clones" }
cf-halstead = { path = "../cf-halstead" }
cf-comments = { path = "../cf-comments" }
cf-imports = { path = "../cf-imports" }
cf-composition = { path = "../cf-composition" }
cf-cohesion = { path = "../cf-cohesion" }
cf-renderer = { path = "../cf-renderer" }
cf-couples = { path = "../cf-couples" }
cf-shotness = { path = "../cf-shotness" }
cf-analyzer-burndown = { path = "../cf-analyzer-burndown" }
cf-devs = { path = "../cf-devs" }
cf-typos = { path = "../cf-typos" }
cf-anomaly = { path = "../cf-anomaly" }
cf-quality = { path = "../cf-quality" }
cf-sentiment = { path = "../cf-sentiment" }
cf-file-history = { path = "../cf-file-history" }

# Scaffold / not-yet-wired sibling crates -- optional, gated behind the
# `runtime` / `mcp` features (streaming framework runner, persistence, plot).
cf-framework = { path = "../cf-framework", optional = true }
cf-config = { path = "../cf-config", optional = true }
cf-checkpoint = { path = "../cf-checkpoint", optional = true }
cf-budget = { path = "../cf-budget", optional = true }
cf-observability = { path = "../cf-observability", optional = true }
cf-plotpage = { path = "../cf-plotpage", optional = true }
cf-storage = { path = "../cf-storage", optional = true }
cf-mcp = { path = "../cf-mcp", optional = true }
