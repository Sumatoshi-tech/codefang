[package]
name = "cf-persist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Codec-based file persistence for arbitrary state types (Rust port of Go pkg/persist)."

[dependencies]
# serde is the in-memory data model used by the codecs. The JSON codec emits
# Go-`encoding/json`-compatible bytes via a self-contained encoder over
# `serde_json::Value` (HTML-escape ON, optional indent, trailing newline,
# map-key byte-sort). serde_json is used ONLY as the value model + decoder here;
# its Serializer is never used to produce output bytes (see DESIGN.md §2).
serde = { workspace = true }
serde_json = { workspace = true }
# itoa/ryu give the shortest round-trip digit sequences that the Go float
# renderer re-formats (see json::go_float). They are the same backends Go's
# strconv shares the shortest-digits property with.
itoa = "1"
ryu = "1"
# Rust-native binary codec replacing Go's `encoding/gob` (dropped per DESIGN.md
# §3: gob is Go-specific and not byte-portable; persist state is never
# user-visible output).
bincode = "1"

[dev-dependencies]
tempfile = "3"
