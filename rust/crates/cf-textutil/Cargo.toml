[package]
name = "cf-textutil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Byte-level text utilities and the canonical report JSON writer for codefang."

[dependencies]
# Report serialization routes through the shared contract encoder, NEVER
# serde_json, so machine-format report bytes stay pinned (DESIGN.md §1.1, §2;
# differential gate: rust/tests/compat). `write_json` wraps `cf-gojson`
# directly.
cf-gojson = { path = "../cf-gojson" }
# Error enums derive Display/Error via thiserror; the error strings are part of
# the CLI compatibility contract.
thiserror = "1"
