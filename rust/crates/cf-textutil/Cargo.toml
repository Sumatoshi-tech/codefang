[package]
name = "cf-textutil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Byte-level text utilities and the canonical Go-compatible WriteJSON writer for codefang reports."

[dependencies]
# Report serialization routes through the shared Go-byte-compatible encoder,
# NEVER serde_json, so MACHINE-format report bytes stay byte-identical with Go.
# The design's encoder is the tier-0 crate `cf-gojson` (DESIGN.md §1.1, §2),
# now implemented, so `cf-textutil`'s `WriteJSON` wraps it directly.
cf-gojson = { path = "../cf-gojson" }
