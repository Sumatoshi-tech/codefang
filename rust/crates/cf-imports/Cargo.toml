[package]
name = "cf-imports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Import/dependency analysis: static import IDs (`imports`) plus per-developer/per-language import usage history (`ImportsPerDeveloper`, id `history/imports`, additive merge)."

[dependencies]
# Report-format JSON encoder: models struct-declaration key order vs byte-sorted
# map keys and nil-slice -> JSON `null`. `ComputedMetrics::to_go_value` builds a
# struct-origin `GoValue` so json/bin output keeps the pinned report contract
# (e.g. `dependencies:null` for the empty report, and declaration field order
# import_list/categories/dependencies/aggregate rather than byte-sorted order).
# Pinned by the differential gate in rust/tests/compat.
cf-gojson = { workspace = true }
# CFB1 `bin` envelope: "CFB1" + LE u32 len + compact JSON payload. Routes
# through cf-gojson internally.
cf-reportutil = { path = "../cf-reportutil" }
#
# This crate intentionally carries minimal local shims (`node`, `report`) so the
# analyzer logic and its tests stand alone and verifiable; the canonical types
# live in cf-uast-node / cf-reportutil and the pipeline crates.
