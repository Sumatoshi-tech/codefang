[package]
name = "cf-imports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Import/dependency analysis: static import IDs (`imports`) plus per-developer/per-language import usage history (`ImportsPerDeveloper`, id `history/imports`, additive merge). Rust port of the Go internal/analyzers/imports package."

[dependencies]
# This crate is std-only at this stage of the port.
#
# In the integrated workspace it will depend on path crates that supply the
# canonical types: cf-uast-node (the Node model + VisitPreOrder/HasAnyRole),
# cf-reportutil (the Report/ReportValue map[string]any model + the CFB1 `bin`
# envelope, which itself routes through cf-gojson), cf-gojson / cf-goyaml (the
# go-compat json/yaml encoders that DESIGN §2 mandates for byte-identical
# MACHINE output), cf-metrics (the Metric/MetricMeta primitives), and the
# cf-framework / cf-analyze / cf-plumbing / cf-persist pipeline crates. Some of
# those siblings are already ported (cf-uast-node, cf-reportutil, cf-metrics);
# others remain scaffolds. This crate intentionally carries minimal local shims
# (`node`, `report`) so the analyzer logic and its ported tests stand alone and
# verifiable; the integration swap is enumerated in the port todos. No external
# registry crates are required to compile.
