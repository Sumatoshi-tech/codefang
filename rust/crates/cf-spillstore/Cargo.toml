[package]
name = "cf-spillstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Port of the Go package internal/analyzers/common/spillstore: a generic
# disk-backed key/value store that spills accumulated state to numbered chunk
# files during streaming hibernation, freeing memory between chunks while
# preserving the full dataset for Finalize. Consumed by analyze, clones,
# couples, and file_history.
#
# Byte-identity note (DESIGN.md §3): the spilled chunk files are intermediate,
# never-user-visible state. The Go original uses encoding/gob, which is dropped
# in the Rust tree because it is not byte-portable. The chunk codec below is a
# Rust-native serde codec; none of these bytes appear in a MACHINE-format
# report, so cf-gojson is intentionally NOT used here.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
