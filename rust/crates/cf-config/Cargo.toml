# cf-config — Rust port of Go package internal/config.
#
# Configuration model (analyzer/pipeline/history/checkpoint constants) plus a
# viper-style loader with precedence flag > env (CODEFANG_) > file > default.
#
# Config is *input*, never machine-format *output*. Per DESIGN.md §2 the
# byte-identity serializers (cf-gojson / cf-goyaml) are reserved for report
# output; reading YAML config here uses serde + serde_yaml, which is the correct
# boundary (no machine-format report bytes are produced by this crate).
[package]
name = "cf-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Configuration model + loader (analyzer/pipeline/history/checkpoint constants). Port of Go internal/config; used by analyze, mcp, cmd/codefang/commands."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { workspace = true }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[lib]
doctest = false
