[package]
name = "cf-halstead"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Halstead complexity metrics: operator/operand detection, derived measures (vocabulary/length/volume/difficulty/effort/time/bugs), and the standalone file-level analysis consumed by the quality analyzer. Output bytes are pinned by the differential gate (rust/tests/compat); the static-pipeline report builder lives in cf-commands."

[dependencies]
# UAST node type the standalone analysis traverses.
cf-uast-node = { path = "../cf-uast-node" }

