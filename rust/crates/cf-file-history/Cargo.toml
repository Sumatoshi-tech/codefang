[package]
name = "cf-file-history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cf-file-history — per-file change history + file classifier.
# Ports internal/analyzers/file_history (Go id: history/file-history).
#
# Report serialization routes exclusively through cf-gojson so the machine-format
# bytes (json/ndjson/timeseries/compact/bin) match Go's encoding/json
# byte-for-byte. See specs/rust-rewrite/DESIGN.md section 2.

[dependencies]
# Go encoding/json-byte-compatible encoder (DESIGN section 2.2). Never serde_json
# for report output.
cf-gojson = { path = "../cf-gojson" }
# Risk level string constants (CRITICAL/HIGH/MEDIUM/LOW), shared with the other
# analyzers' hotspot logic (pkg/metrics.RiskLevel).
cf-metrics = { path = "../cf-metrics" }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
