[package]
name = "cf-couples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cf-couples — file/developer co-change coupling analysis.
#
# Ports internal/analyzers/couples (Go id: history/couples, non-sequential /
# parallelizable). It builds the file co-occurrence matrix (files changed in the
# same commit) and the developer co-occurrence matrix (developers touching the
# same file), plus per-file ownership cardinality (HyperLogLog), all from sorted
# indices so the output is deterministic. The coupling-strength formula is
# code-maat's `co_changes / avg(revs_a, revs_b)` capped at 1.0.
#
# Report serialization routes exclusively through cf-gojson (and, once wired,
# cf-goyaml) so the machine-format bytes (json/yaml/ndjson/timeseries/compact/
# bin) match Go's encoding/json byte-for-byte. See specs/rust-rewrite/DESIGN.md §2.

[features]
default = ["hll"]
# Use the bit-identical HyperLogLog sketch (pkg/alg/hll) for per-file
# contributor cardinality. Without it, an exact distinct-count fallback is used.
hll = ["dep:cf-alg-hll"]

[dependencies]
# Go encoding/json-byte-compatible encoder (DESIGN §2.2). NEVER serde_json for
# output: report types build a GoValue tree consumed by cf-gojson (and cf-goyaml).
cf-gojson = { path = "../cf-gojson" }
# Identity helpers: split_identity ("name|email" → (name, email)) and the
# AuthorMissing sentinel, used by developer-coupling name/email extraction.
cf-identity = { path = "../cf-identity" }
# HyperLogLog cardinality sketch (pkg/alg/hll), keyed by LittleEndian(devID).
# The contributor count is an integer in machine output, so it must be
# bit-identical to Go. Optional behind the `hll` feature.
cf-alg-hll = { path = "../cf-alg-hll", optional = true }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
