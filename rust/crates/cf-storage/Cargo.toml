# cf-storage — Rust port of Go package `internal/storage`.
#
# Storage backend abstraction. The Go package's sole responsibility is
# `WriteAtomic`: write to a target path atomically by writing a `.tmp` sibling,
# syncing it to disk, then renaming over the target, so a reader never observes a
# partially written file. Used by cache, analyze, and the `render` command (which
# writes `report.json` + HTML artifacts).
#
# This crate emits NO machine-format report bytes itself — the caller's `write`
# closure produces the bytes — so it does NOT depend on cf-gojson/cf-goyaml.
# Callers serialize through those crates and write the finished bytes to the
# provided writer.
#
# No external dependencies: the Go implementation uses only os/io/fmt, all of
# which map onto the Rust standard library.
[package]
name = "cf-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Atomic file writes (port of Go internal/storage WriteAtomic)."

[dependencies]

[dev-dependencies]
# Scratch directories for unit tests only (mirrors Go's t.TempDir()).
tempfile = "3"
