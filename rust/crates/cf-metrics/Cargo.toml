# cf-metrics — Rust port of Go package pkg/metrics.
#
# Lightweight metrics primitives reused across analyzers: the Metric trait,
# MetricMeta metadata helper, TimeSeriesPoint / RiskResult report types,
# RiskLevel + risk_priority ordering, and a name-keyed Registry.
#
# The report-bearing types (TimeSeriesPoint, RiskResult) appear in MACHINE-format
# output. Per DESIGN.md §1 rule (1) / §3, machine-format bytes (json/yaml/ndjson/
# timeseries/compact/bin) MUST be emitted by the shared cf-gojson / cf-goyaml
# byte-compat crates, never by serde defaults. This crate therefore carries no
# serde dependency: the report types implement GoSerialize, lowering to the shared
# cf_gojson::GoValue tree (struct-origin GoMap = declaration order, omitempty
# honored), which the cf-gojson marshaller turns into byte-identical output.
[package]
name = "cf-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Lightweight metrics primitives (Metric trait, RiskLevel/RiskResult, TimeSeriesPoint, Registry). Port of Go pkg/metrics; used by many analyzers."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cf-gojson = { path = "../cf-gojson" }

[dev-dependencies]

[lib]
doctest = false
