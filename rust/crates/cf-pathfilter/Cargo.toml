# cf-pathfilter — path include/exclude filtering.
#
# Purpose: excludes vendor, third-party, and generated files from analysis.
# Vendor detection reproduces `src-d/enry`'s `IsVendor` (DESIGN §2.6 — enry
# classification is decision-parity-critical, so the SAME enry `data/vendor.go`
# regex tables are vendored here, generated by build.rs from the pinned enry
# source, rather than swapping detectors).
#
# This crate emits no machine-format report bytes, so it does NOT depend on the
# compat serialization crates cf-gojson / cf-goyaml. Its parity surface is the
# boolean include/exclude decision, which selects which files appear in reports
# (pinned by rust/tests/compat).
[package]
name = "cf-pathfilter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Path include/exclude filtering (vendor + generated-file detection). Used by pathpolicy, framework, plumbing, file_history."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# enry's vendor.yml patterns are RE2-style; `regex` is the RE2-lineage engine
# matching enry's regexp semantics for these anchored-substring patterns.
regex = "1"

[dev-dependencies]

[lib]
doctest = true
