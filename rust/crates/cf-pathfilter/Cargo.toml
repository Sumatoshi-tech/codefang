# cf-pathfilter — Rust port of Go package `pkg/pathfilter`.
#
# Purpose: path include/exclude filtering. Excludes vendor, third-party, and
# generated files from analysis. Vendor detection mirrors `src-d/enry`'s
# `IsVendor` (DESIGN §2.6 — enry classification is decision-parity-critical, so
# the SAME enry `data/vendor.go` regex tables are vendored here, generated by
# build.rs from the pinned enry source, rather than swapping detectors).
#
# This crate emits no machine-format report bytes, so it does NOT depend on the
# go-compat serialization crates cf-gojson / cf-goyaml. Its parity surface is the
# boolean include/exclude decision, which selects which files appear in reports.
[package]
name = "cf-pathfilter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Path include/exclude filtering (vendor + generated-file detection). Port of Go pkg/pathfilter; used by pathpolicy, framework, plumbing, file_history."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# enry's vendor.yml patterns are RE2-style; `regex` is the RE2-lineage engine
# matching Go `regexp` semantics for these anchored-substring patterns.
# `once_cell` lazily compiles the combined matcher once.
#
# NOTE for central integration (port rule 4): these two crates are NOT yet in the
# workspace [workspace.dependencies] table (which currently pins only
# clap/git2/tree-sitter/serde/serde_json/sha2). They are reported in
# `externalCrates`; once added centrally these lines can become `{ workspace = true }`.
regex = "1"
once_cell = "1"

[dev-dependencies]

[lib]
doctest = true
