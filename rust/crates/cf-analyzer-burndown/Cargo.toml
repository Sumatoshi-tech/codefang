[package]
name = "cf-analyzer-burndown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Report serialization routes exclusively through cf-gojson (JSON/bin) and
# cf-goyaml (YAML) so the burndown ComputedMetrics output stays byte-identical
# to Go's encoding/json + gopkg.in/yaml.v3.
cf-gojson = { path = "../cf-gojson" }
cf-goyaml = { path = "../cf-goyaml" }
