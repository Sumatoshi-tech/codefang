[package]
name = "cf-analyzers-plumbing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Analyzer-level git/UAST data providers (TreeDiff, FileDiff, BlobCache, TicksSinceStart, IdentityDetector, LanguagesDetection, UASTChanges). Port of Go internal/analyzers/plumbing."

[dependencies]
# libgit2 bindings (design dependency mapping §3: go-git -> git2, KEEP libgit2).
# Pinned once in the workspace with the vendored-libgit2 feature. Used only by
# the optional libgit2-backed BlobSource/TreeSource adapters.
git2 = { workspace = true }

# Ergonomic error derives for the local AnalyzerError taxonomy (mirrors Go's
# `error` returns). thiserror is widely used by sibling crates (cf-uast-node,
# cf-pathpolicy); it is NOT yet in [workspace.dependencies] so it is pinned
# locally and reported in externalCrates for central integration (port rule 4).
thiserror = "1"

[dev-dependencies]
# Temp files for the IdentityDetector LoadPeopleDict test. Already present in the
# workspace lockfile (used by cf-checkpoint/cf-streaming dev-deps).
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

# NOTE (DESIGN rule 5 / port rule 5): the byte-identity-critical line-diff engine
# (sergi/go-diff v1.4.0 `diffmatchpatch`) and the enry-parity language classifier
# (go-enry/v2 v2.9.5) have NO offline-available, byte-faithful Rust crate, so they
# are expressed as the local `LineDiffer` / `EnryClassifier` traits and injected.
# The intended implementations are a `cf-godiff` crate (faithful go-diff port) and
# the enry-data port that cf-pathfilter/cf-langpath already vendor. See crate todos.
