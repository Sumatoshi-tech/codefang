[package]
name = "codefang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "codefang"
path = "src/main.rs"

[features]
default = []
# The `mcp` command (cmd/codefang/commands/mcp.go) carries `//go:build ignore`
# in Go and is NOT wired into the root command. Mirror that: feature-gated, off
# by default. See DESIGN.md §4.1.
mcp = []
# `--profile` pprof HTTP server (localhost:6060). The memory watchdog is always
# available; this feature is reserved for the pprof HTTP endpoints (behavioral
# parity only, never machine output bytes).
profile = []

[dependencies]
clap = { workspace = true }
# KEEP libgit2 (vendored via git2). The entrypoint links a core libgit2 path so
# the binary anchors the vendored build (DESIGN §3); cf-commands/cf-gitlib own
# the per-thread Repository usage.
git2 = { workspace = true }
# The entire CLI surface + the general run pipeline (registry-driven dispatch to
# the analyzer crates) live in cf-commands (DESIGN §1 tier 8). This binary is a
# thin shell that bootstraps malloc tunables + the --profile watchdog, then calls
# cf_commands::run(argv).
cf-commands = { path = "../../crates/cf-commands" }
