name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# The project is a single Rust workspace rooted at the repo root. The git2
# crate builds a vendored libgit2 from third_party/libgit2, so the submodule
# must be checked out and a C toolchain + CMake must be present. The toolchain
# channel/components are pinned by rust-toolchain.toml.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev zlib1g-dev

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Formatting is a hard gate: the workspace is fully rustfmt-clean under the
      # pinned toolchain.
      - name: Format check
        run: cargo fmt --all -- --check

      # Clippy is ADVISORY (continue-on-error): the workspace still carries
      # pre-existing clippy debt (e.g. clippy::never_loop, clippy::approx_constant
      # in test code) that predates the Rust-only cutover. It surfaces findings
      # without blocking; switch to blocking once the debt is cleared.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
