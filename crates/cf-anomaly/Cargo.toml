[package]
name = "cf-anomaly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cf-anomaly — temporal anomaly detection with trailing-window Z-scores
# (analyzer id: history/anomaly). Also used by the quality and sentiment
# analyzers via the cross-analyzer enrichment path.
#
# Report serialization routes exclusively through cf-gojson / cf-goyaml: the
# analyzer builds ONE GoValue tree and the handlers encode it per format.

[dependencies]
# Mean/stddev/z-score helpers. Every float that reaches a machine report is
# produced here, so the arithmetic order is part of the report contract.
cf-alg-stats = { path = "../cf-alg-stats" }
# Report-format JSON encoder (the report types expose `to_go_value()`; the
# yaml path renders the same tree through cf-goyaml).
cf-gojson = { path = "../cf-gojson" }
# Deterministic unstable-sort port used for the cross-analyzer enrichment
# lists (`sort_external_results`).
cf-gosort = { path = "../cf-gosort" }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
# The yaml rendering of the report tree is asserted alongside the json one.
cf-goyaml = { path = "../cf-goyaml" }
