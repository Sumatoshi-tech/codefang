[package]
name = "cf-anomaly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cf-anomaly — temporal anomaly detection with trailing-window Z-scores
# (analyzer id: history/anomaly). Also used by the quality and sentiment
# analyzers via the cross-analyzer enrichment path.
#
# Report serialization routes exclusively through cf-gojson / cf-goyaml; the
# machine-format bytes (json/yaml/ndjson/timeseries/compact/bin) are pinned
# against the reference implementation by tests/compat.

[dependencies]
# Mean/stddev/z-score helpers. Every float that reaches a machine report is
# produced here, so the arithmetic order is part of the report contract.
cf-alg-stats = { path = "../cf-alg-stats" }
# Report-format-compatible JSON encoder. NEVER serde_json. YAML output routes
# the SAME GoValue tree through cf-goyaml once that crate lands; the report
# types expose `to_go_value()` for both paths.
cf-gojson = { path = "../cf-gojson" }
# Bit-exact port of Go's sort.Slice (pdqsort). The anomaly lists are sorted
# with an unstable sort in the reference binary, so tie order on equal
# Z-scores is part of the report contract and must match exactly.
cf-gosort = { path = "../cf-gosort" }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
