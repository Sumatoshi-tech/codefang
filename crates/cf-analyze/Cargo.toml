[package]
name = "cf-analyze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Analyzer registry/dispatch hub + analyzer interfaces, BaseHistoryAnalyzer, and cross-format report conversion (json/yaml/ndjson/timeseries/binary). Stays BELOW the framework layer. See specs/rust-rewrite/DESIGN.md §3."

[dependencies]
# Tier-0 report-format serialization crates (byte-pinned by tests/compat).
# ALL machine-format report
# bytes (json, yaml, ndjson, timeseries, timeseries+ndjson, compact, bin) flow
# through these — never serde_json/serde_yaml for output (DESIGN §2).
cf-gojson = { path = "../cf-gojson" }
cf-goyaml = { path = "../cf-goyaml" }
# CFB1 "bin"/"binary" envelope encode/decode (DESIGN §2.5).
cf-reportutil = { path = "../cf-reportutil" }
# ConfigurationOption (analyzer config surface) + WorkerPool (parallel dispatch).
cf-pipeline = { path = "../cf-pipeline" }
# AnalysisMetadata.codefang_version source.
cf-version = { path = "../cf-version" }
# mapx helpers: unique() (registry.rs) and build_lookup_set() (timeseries.rs).
cf-alg-mapx = { path = "../cf-alg-mapx" }
# Node trait parameter for the interfaces.rs analyzer hierarchy.
cf-uast-node = { path = "../cf-uast-node" }
# Sentinel error derive for error.rs (AnalyzeError).
thiserror = "1"

[dev-dependencies]
# Tests only: serde_json is used SOLELY to PARSE machine output back into a value
# tree for assertions (as the reference test suite does). It is NEVER used
# to PRODUCE report bytes — all output goes through cf-gojson/cf-goyaml/
# cf-reportutil per DESIGN §2.
serde_json = { workspace = true }
