# cf-shotness — structural hotspots: co-change of DSL-selected UAST entities
# (analyzer id: history/shotness).
#
# All machine-format report serialization routes through cf-gojson; the
# json/yaml/ndjson/timeseries/compact/bin bytes are pinned against the
# reference implementation by tests/compat. NEVER serde_json for output.

[dependencies]
# Report-format-compatible value model + encoder. The analyzer builds its
# report as a GoValue tree; serialization is owned by the report layer.
# NEVER serde_json.
cf-gojson = { workspace = true }

