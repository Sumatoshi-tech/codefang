[package]
name = "cf-shotness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cf-shotness — structural hotspots: co-change of DSL-selected UAST entities
# (analyzer id: history/shotness). The live entity state (touch / couple /
# rename / end) and the metrics over its report.
#
# All machine-format report serialization routes through cf-gojson. NEVER
# serde_json for output.

[dependencies]
# Spill encoding of finished history results (cf-commands `spill`).
serde = { workspace = true }
# Report-format-compatible value model + encoder. The analyzer builds its
# report as a GoValue tree; serialization is owned by the report layer.
# NEVER serde_json.
cf-gojson = { workspace = true }

[lints.clippy]
pedantic = "warn"
