[package]
name = "cf-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# OTel API/SDK pinned to 0.24 — the release line these modules target
# (`opentelemetry::metrics::MetricsError`, public `metrics::noop`, instrument
# `.init()`, `with_unit(&str)`); opentelemetry-prometheus 0.17 / prometheus 0.13
# are its matching exporter pair (no exporter release exists for otel 0.25/0.26).
opentelemetry = { version = "0.24", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.24", default-features = false, features = ["metrics", "trace"] }
opentelemetry-prometheus = "0.17"
prometheus = "0.13"
# config.rs carries the minimum log severity as tracing::Level.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# logger.rs JSON record shape. Allowed here: observability is outside the
# report path (DESIGN §2 — no report bytes come from this crate).
serde_json = { workspace = true }
# Error derive; every error Display string stays a stable operator surface.
thiserror = "1"
# diagnostics.rs HTTP server.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["net", "sync", "rt", "macros"] }

[dev-dependencies]
# #[tokio::test] in health.rs/diagnostics.rs plus the raw TCP test client.
tokio = { version = "1", default-features = false, features = ["net", "sync", "rt", "rt-multi-thread", "macros", "io-util"] }
