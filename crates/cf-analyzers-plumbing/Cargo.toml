[package]
name = "cf-analyzers-plumbing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Per-commit facts shared by every history analyzer walk: HistoryTicks (tick assignment) and IdentityDetector (author ids)."

[dependencies]
# The AUTHOR_MISSING sentinel and its display name are owned by cf-identity;
# this crate re-exports them so every consumer sees ONE constant.
cf-identity = { path = "../cf-identity" }

[dev-dependencies]
# Temp files for the IdentityDetector load_people_dict tests.
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
