# cf-alg-bloom — space-efficient probabilistic set-membership filter (Bloom
# filter) using the Kirsch–Mitzenmacher (2006) double-hashing technique over an
# FNV-128a kernel.
#
# This crate is INTERNAL behavior only: per DESIGN.md the bloom filter is used
# by cf-alg-lru, analyze, cohesion and couples as a membership pre-filter and
# never appears in any MACHINE-format report. It therefore does NOT depend on
# the cf-gojson / cf-goyaml byte-compat serialization crates. Its to_binary /
# from_binary on-the-wire layout (big-endian header + words) is a frozen
# compatibility contract for any cross-boundary persisted state, but is not
# user-visible serialization.
[package]
name = "cf-alg-bloom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
thiserror = "1"

[dev-dependencies]
