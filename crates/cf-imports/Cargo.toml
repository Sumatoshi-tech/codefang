[package]
name = "cf-imports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Import/dependency analysis: language-aware import extraction over the UAST (`static/imports`) plus per-developer/per-language import usage history (`history/imports`, additive merge)."

[dependencies]
# Spill encoding of finished history results (cf-commands `spill`).
serde = { workspace = true }
# Report-format JSON encoder: `ComputedMetrics::to_go_value` builds a
# struct-origin `GoValue` so json/yaml/bin output keeps declaration field order
# (import_list/categories/dependencies/aggregate) and `dependencies: null` for
# the empty report.
cf-gojson = { workspace = true }
# The canonical UAST node the extractor walks (type, token, roles, positions,
# children). The parser facade (cf-uast) is only needed to BUILD trees, which
# the callers and the tests do.
cf-uast-node = { path = "../cf-uast-node" }

[dev-dependencies]
# Real tree-sitter parses for the per-language extraction tests: every
# expectation is asserted against the tree the production parser produces.
cf-uast = { path = "../cf-uast" }
# The yaml rendering of the history report is asserted alongside the json one.
cf-goyaml = { path = "../cf-goyaml" }
