# cf-iosafety — Safe/bounded I/O wrappers: defensive file reading and
# terminal-output sanitization for user-supplied paths and strings. Used by
# the uast library and the uast command. See specs/rust-rewrite/DESIGN.md.
#
# sanitize_for_terminal is cosmetic/non-binding terminal output per DESIGN
# §2.7, but its HTML escaping + control-stripping is byte-exact for caller
# alignment, so it does not route through the cf-gojson/cf-goyaml
# serialization crates (it emits no machine-format report bytes).
[package]
name = "cf-iosafety"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = "1"

[dev-dependencies]
tempfile = { workspace = true }
