[package]
name = "cf-quality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Spill encoding of finished history results (cf-commands `spill`).
serde = { workspace = true }
# Serialization compat (DESIGN section 2): all machine output goes through these.
cf-gojson = { workspace = true }
cf-reportutil = { path = "../cf-reportutil" }
# Numeric parity for mean/median/P95/max/min/sum (shared statistics kernel).
cf-alg-stats = { path = "../cf-alg-stats" }
# The per-file sample is the four static analyzers' own math over the parsed
# UAST (`analyzer::analyze_file`), so the quality numbers are the static
# analyzers' numbers for the same file.
cf-uast-node = { path = "../cf-uast-node" }
cf-complexity = { path = "../cf-complexity" }
cf-halstead = { path = "../cf-halstead" }
cf-comments = { path = "../cf-comments" }
cf-cohesion = { path = "../cf-cohesion" }

[dev-dependencies]
# Real parsed trees for the per-file sample tests.
cf-uast = { path = "../cf-uast" }
