[package]
name = "cf-uast-mappings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The static model (LanguageMapping/MappingRule), closed vocabularies, and the
# uast_language! macro the generated modules expand through.
cf-uast-mapping = { path = "../cf-uast-mapping" }

[dev-dependencies]
# Grammar-conformance test (tests/grammar_conformance.rs): compiles every rule
# pattern as a tree_sitter::Query against the wired grammars.
cf-uast = { path = "../cf-uast" }
tree-sitter = { workspace = true }
# Shape-contract tests (tests/shape_contract.rs) read lowered nodes; the
# schema-vocabulary test (tests/schema_vocabulary.rs) checks every emitted
# type/role against the embedded JSON schema.
cf-uast-node = { path = "../cf-uast-node" }
cf-uast-spec = { path = "../cf-uast-spec" }
serde_json = { workspace = true }
