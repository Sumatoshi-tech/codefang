[package]
name = "cf-clones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cf-clones — static code-clone detection (analyzer id: static/clones).
#
# Pipeline: per function, a structural profile (pre-order node types, exact
# shingle set, structure/token fingerprints) + a MinHash signature; one global
# 32x4 LSH index proposes candidate pairs; every candidate is verified by exact
# shingle Jaccard and classified Type-1/2/3 from the fingerprints.
#
# Report serialization routes through cf-gojson / cf-reportutil, never
# serde_json.

[dependencies]
# MinHash signatures (fixed seeds) — the LSH input.
cf-alg-minhash = { path = "../cf-alg-minhash" }
# Banded LSH candidate index.
cf-alg-lsh = { path = "../cf-alg-lsh" }
# FNV-1a for shingle and fingerprint hashing.
cf-alg-hashutil = { path = "../cf-alg-hashutil" }
# UAST node type, traversal, and the UAST/Role string constants.
cf-uast-node = { path = "../cf-uast-node" }
# Report-contract JSON values (GoValue / GoMap).
cf-gojson = { path = "../cf-gojson" }
# Report formatting helpers (format_float / pct / format_percent).
cf-reportutil = { path = "../cf-reportutil" }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
# Real parsed trees for the detection tests (Go sources through the actual
# UAST parser) — the unit tests exercise the same input the CLI feeds.
cf-uast = { path = "../cf-uast" }
