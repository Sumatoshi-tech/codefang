[package]
name = "cf-clones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cf-clones — static code-clone detection (MinHash 128 + LSH 16x8, fixed
# seeds; analyzer id: static/clones).
#
# Report serialization routes exclusively through cf-gojson / cf-reportutil so
# the machine-format bytes (json/yaml/ndjson/timeseries/compact/bin) match the
# report contract byte-for-byte. See specs/rust-rewrite/DESIGN.md §2.
# (YAML routes the SAME GoValue tree through cf-goyaml; ComputedMetrics
# exposes `to_go_value()` for both the JSON and YAML paths.)

[dependencies]
# MinHash signatures — pinned seeds/hashing (bit-identical to the reference).
cf-alg-minhash = { path = "../cf-alg-minhash" }
# LSH index — pinned band hashing.
cf-alg-lsh = { path = "../cf-alg-lsh" }
# UAST node type, traversal, and the UAST/Role string constants.
cf-uast-node = { path = "../cf-uast-node" }
# Analyzer contracts (Analyzer/StaticAnalyzer/Report/Descriptor/Thresholds).
cf-analyze = { path = "../cf-analyze" }
# Report-contract JSON encoder (DESIGN §2.2). NEVER serde_json.
cf-gojson = { path = "../cf-gojson" }
# CFB1 binary envelope + report accessors/formatters.
cf-reportutil = { path = "../cf-reportutil" }
# Frozen Go pdqsort — the reference's sort.Slice permutation is part of the
# terminal/text output contract (tie order among equal-similarity pairs).
cf-gosort = { path = "../cf-gosort" }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
