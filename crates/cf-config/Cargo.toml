# cf-config — the `codefang` configuration file (`.codefang.yaml` + the
# `CODEFANG_*` environment) as the default layer of the `run` flags.
#
# Config is *input*, never machine-format *output*: the byte-identity
# serializers (cf-gojson / cf-goyaml) are reserved for report output, and
# serde_yaml here only parses the file.
[package]
name = "cf-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The codefang configuration file: discovery, the CODEFANG_* environment, and the supported keys that default the run flags."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { workspace = true }
serde_yaml = "0.9"
# Derived Display/Error impls for LoadError.
thiserror = "1"

[dev-dependencies]
tempfile = "3"
