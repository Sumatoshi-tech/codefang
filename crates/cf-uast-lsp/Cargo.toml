[package]
name = "cf-uast-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Language Server Protocol (LSP) server for the UAST mapping DSL."

[dependencies]
# tower-lsp is the LSP stack (DESIGN §3). It pulls in lsp-types for the
# protocol-3-16 wire structs and a tower-based JSON-RPC service.
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-tokio"] }
# Async runtime for the stdio server loop. tower-lsp::Server::new requires an
# AsyncRead/AsyncWrite pair; tokio::io::{stdin,stdout} provide them.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
