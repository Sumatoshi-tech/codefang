[package]
name = "cf-cohesion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned unstable sort (pdqsort) for tie ordering in report tables.
cf-gosort = { workspace = true }
# UAST node type the analyzer/visitor traverse.
cf-uast-node = { path = "../cf-uast-node" }
# Shared Bloom filter; its exact hash family is load-bearing for the cohesion
# scores (false positives are part of the defined behavior).
cf-alg-bloom = { path = "../cf-alg-bloom" }
