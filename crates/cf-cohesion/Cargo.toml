[package]
name = "cf-cohesion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# UAST node type the analyzer walks.
cf-uast-node = { path = "../cf-uast-node" }
# On-demand stack growth for the recursive walk over deeply nested sources.
stacker = "0.1.24"

[dev-dependencies]
# The crate's tests run the analyzer over REAL parsed trees: the parser facade
# is a test-only dependency (grammars are already built for the workspace).
cf-uast = { path = "../cf-uast" }
