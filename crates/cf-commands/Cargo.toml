[package]
name = "cf-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Analyzer-registration + clap command construction for codefang: the run/version/completion command tree, the configuration-file layer, and dynamic per-analyzer flags."

# cf-commands is the tier-8 analyzer-registration + clap command-construction
# aggregation point (DESIGN §1 tier 8, §4): it builds the run/version/completion
# clap commands, registers every analyzer and its dynamic per-analyzer flags,
# and routes all report serialization through the shared report-format crates
# (never raw serde). Output bytes are pinned against the reference binary by
# the report e2e suites in bins/codefang/tests.

[dependencies]
clap = { workspace = true }
thiserror = "1"
# SIGINT/SIGTERM → cooperative cancellation of the static folder walks.
signal-hook = { workspace = true }
# Generates the shell-completion scripts for the `completion` subcommand, the
# Rust analogue of the bytes cobra emits for its auto-registered completion
# command (bash/fish/powershell/zsh).
clap_complete = "4"

# Real, compiling sibling crates depended on unconditionally.
cf-version = { path = "../cf-version" }
# The `.codefang.yaml` / CODEFANG_* layer that defaults the run flags.
cf-config = { path = "../cf-config" }
cf-pipeline = { path = "../cf-pipeline" }

# --- Run-pipeline execution crates (the general run pipeline + registry) ---
# Report serialization MUST route through these report-format crates, never serde.
cf-gojson = { path = "../cf-gojson" }
cf-goyaml = { path = "../cf-goyaml" }
cf-reportutil = { path = "../cf-reportutil" }
# UAST parse for the shared static folder phase (parse the file set once).
cf-uast = { path = "../cf-uast" }
cf-uast-node = { path = "../cf-uast-node" }
# Vendor/generated path-policy exclusion shared by the static + history phases.
cf-pathpolicy = { path = "../cf-pathpolicy", features = ["default-deps"] }
# libgit2-backed repository/commit access for the single history revwalk.
cf-gitlib = { path = "../cf-gitlib" }
# Returns freed heap pages to the OS between history chunks.
cf-meminfo = { path = "../cf-meminfo" }
# The history memory budget: size parsing + RAM detection, chunk planning.
cf-framework = { path = "../cf-framework" }
cf-budget = { path = "../cf-budget" }
cf-streaming = { path = "../cf-streaming" }
cf-units = { path = "../cf-units" }
# Finished results spilled to disk while other walks run: the binary codec,
# serde for the records, and unlinked temporary files.
cf-persist = { path = "../cf-persist" }
# `codefang mcp`: the MCP server and its tool contracts.
cf-mcp = { path = "../cf-mcp", features = ["mcp"] }
# Reads report bytes back: the MCP tools hand the CLI's json reports to the
# client, and the cross-analyzer parity tests compare them. Report OUTPUT
# never routes through serde.
serde_json = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
# Pinned RFC3339 formatting + metadata for history tick bounds / timeseries.
cf-analyze = { path = "../cf-analyze" }
cf-textutil = { path = "../cf-textutil" }
cf-langpath = { path = "../cf-langpath" }
# Line-mode diff (diffmatchpatch parity) for history per-file line stats.
cf-godiff = { path = "../cf-godiff" }
cf-alg-levenshtein = { path = "../cf-alg-levenshtein" }
cf-analyzers-plumbing = { path = "../cf-analyzers-plumbing" }
cf-burndown-core = { path = "../cf-burndown-core" }
# --- Analyzer math crates (per-file Analyze + report serializers) ---
cf-complexity = { path = "../cf-complexity" }
cf-clones = { path = "../cf-clones" }
cf-halstead = { path = "../cf-halstead" }
cf-comments = { path = "../cf-comments" }
cf-imports = { path = "../cf-imports" }
cf-composition = { path = "../cf-composition" }
cf-cohesion = { path = "../cf-cohesion" }
cf-renderer = { path = "../cf-renderer" }
cf-couples = { path = "../cf-couples" }
cf-shotness = { path = "../cf-shotness" }
cf-analyzer-burndown = { path = "../cf-analyzer-burndown" }
# --format plot HTML page renderer: the static-phase plot path renders
# per-analyzer pages + index + report.json.
cf-plotpage = { path = "../cf-plotpage" }
cf-devs = { path = "../cf-devs" }
cf-typos = { path = "../cf-typos" }
cf-anomaly = { path = "../cf-anomaly" }
cf-quality = { path = "../cf-quality" }
cf-sentiment = { path = "../cf-sentiment" }
cf-file-history = { path = "../cf-file-history" }
cf-terminal = { path = "../cf-terminal" }

[dev-dependencies]
# Test fixtures build tiny multi-language git repositories in memory-backed
# tempdirs (history-filter oracle tests) — write access comes straight from
# git2, the same libgit2 vendoring cf-gitlib is pinned to.
git2 = { workspace = true }
# Deterministic commit fixtures for the history-window tests (feature-gated, so
# it is compiled for tests only).
cf-gitlib = { path = "../cf-gitlib", features = ["testutil"] }
