# cf-framework — analysis-framework configuration and shared plumbing.
#
# Coordinator configuration + memory model, stage metrics, diff-cache keying,
# commit batching, sampler config, profiling hooks, and budget hooks. See
# specs/rust-rewrite/DESIGN.md (tier 3-5) for where this crate sits in the
# workspace. The cross-crate boundary shapes live in `interfaces`; see the
# crate-level docs.
[package]
name = "cf-framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Saturating numeric conversions, used by coordinator.rs (memory-limit casts)
# and config.rs (size parsing).
cf-safeconv = { path = "../cf-safeconv" }
thiserror = "1"
