[package]
name = "cf-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Report renderer dispatch: JSON model structs (score-last fields), terminal SectionRenderer, executive summary, and metrics output."

[dependencies]
thiserror = "1"
# Machine-format report bytes (json/yaml/...) MUST route through the shared
# report-format serialization crates from the design (DESIGN.md §1.1, §2.3:
# cf-gojson / cf-goyaml), NEVER serde_json/serde_yaml, so output stays
# byte-identical with the reference implementation (pinned by
# tests/compat). The encoder subset this crate needs lives in its
# `gocompat` module (same GoValue/Encoder API shape). Consolidation plan:
# depend on the shared crates and delete `gocompat` once their encoders are
# wired through this path:
#   cf-gojson = { path = "../cf-gojson" }
#   cf-goyaml = { path = "../cf-goyaml" }
#
# The renderer-facing subsets of the analysis model (ReportSection, Issue,
# Metric, DistributionItem, severity/score constants) and the terminal helpers
# (Config, colors, layout) live in this crate's `analyze` and `terminal`
# modules. Consolidation plan: replace them with path deps on the full crates:
#   cf-analyze  = { path = "../cf-analyze" }
#   cf-terminal = { path = "../cf-terminal" }
