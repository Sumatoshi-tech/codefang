[package]
name = "cf-complexity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cf-complexity — static cyclomatic/cognitive/nesting complexity analyzer
# (analyzer id: static/complexity). Also used by the history quality analyzer.
#
# The crate owns the math (counting rules, thresholds, aggregation, ordering)
# and the UAST bridge; the cf-commands handlers own I/O and serialization.
# Report values are built as cf-gojson GoValue trees (never serde_json).

[dependencies]
# Report-contract value model + encoder (DESIGN §2.2).
cf-gojson = { workspace = true }
# The canonical UAST node model: `node::Node::from_uast` is the one bridge
# every report format shares.
cf-uast-node = { path = "../cf-uast-node" }
# On-demand stack growth for the recursive walks — the trees come from
# cf-uast, which already needs a segmented stack to build them (>10k nesting
# levels on real sources).
stacker = "0.1.24"

[dev-dependencies]
# Fixture tests parse real multi-language sources and assert hand-computed
# metrics end-to-end from source text.
cf-uast = { path = "../cf-uast" }

[lints.clippy]
pedantic = "warn"
